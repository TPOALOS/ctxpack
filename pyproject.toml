[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxpack"
version = "1.0.0"
description = "Pack a project into one prompt-ready file for an AI assistant: respects .gitignore, leaves out secret files, redacts tokens, strips invisible Unicode, fits a token budget. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["llm", "prompt", "context", "repo-to-prompt", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/ctxpack"

[project.scripts]
ctxpack = "ctxpack:main"

[tool.setuptools]
py-modules = ["ctxpack"]
